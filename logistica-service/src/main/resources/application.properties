spring.application.name=logistica-service
server.port=8084

spring.datasource.url=jdbc:mysql://host.docker.internal:3306/donaton_logistica?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

donaciones.service.url=http://donaciones-service/api/v1/donaciones
necesidades.service.url=http://necesidades-service/api/v1/necesidades

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
